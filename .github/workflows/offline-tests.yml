name: Offline tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python 3.13 offline suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run offline tests
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          passed=0
          failed=0

          for test_file in tests/test_*.py; do
            case "$test_file" in
              tests/test_real_*|\
              tests/test_twelvedata_auth.py|\
              tests/test_twelvedata_auth_header.py|\
              tests/test_analysis_pipeline_direct.py|\
              tests/test_pipeline.py)
                continue
                ;;
            esac

            echo "::group::$test_file"

            if python "$test_file"; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
            fi

            echo "::endgroup::"
          done

          echo "Offline tests passed: $passed"
          echo "Offline tests failed: $failed"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
